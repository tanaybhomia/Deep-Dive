name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint Python Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 deepdive/ --count --select=E9,F63,F7,F82 --show-source --statistics

  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: DeepDive.flatpak
          manifest-path: io.github.tanaybhomia.DeepDive.yml
          cache-key: flatpak-builder-${{ github.sha }}

  validate-metadata:
    name: Validate Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Validation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils appstream
      - name: Validate Desktop File
        run: desktop-file-validate data/io.github.tanaybhomia.DeepDive.desktop
      - name: Validate AppStream XML
        run: appstreamcli validate --no-net --explain data/io.github.tanaybhomia.DeepDive.metainfo.xml
